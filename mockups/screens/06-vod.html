<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>VOD</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0}body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Roboto}
.phone{width:375px;height:812px;background:#000;border-radius:40px;overflow:hidden}
.header{background:#000;padding:16px;border-bottom:1px solid #1E1E1E;color:#FFD700;font-size:20px;font-weight:600}
.content{height:calc(812px - 112px);overflow-y:auto;background:#000;padding:16px}
.section{margin-bottom:24px}.section-title{color:#FFF;font-size:16px;font-weight:600;margin-bottom:12px}
.movies{display:flex;gap:12px;overflow-x:auto}.movie{min-width:120px;max-width:120px}.poster{width:120px;height:180px;background:linear-gradient(135deg,#2a2a2a,#1a1a1a);border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:#FFD700;font-size:32px}.movie-title{color:#FFF;font-size:12px;font-weight:500}
</style></head><body>
<div class="phone">
<div class="header">Filmes e Séries</div>
<div class="content">
<div class="section"><div class="section-title">Em Alta</div><div class="movies">
<div class="movie"><div class="poster">🎬</div><div class="movie-title">Filme 1</div></div>
<div class="movie"><div class="poster">🎥</div><div class="movie-title">Filme 2</div></div>
<div class="movie"><div class="poster">🎞️</div><div class="movie-title">Filme 3</div></div>
</div></div>
<div class="section"><div class="section-title">Ação</div><div class="movies">
<div class="movie"><div class="poster">💥</div><div class="movie-title">Ação 1</div></div>
<div class="movie"><div class="poster">🔥</div><div class="movie-title">Ação 2</div></div>
<div class="movie"><div class="poster">⚡</div><div class="movie-title">Ação 3</div></div>
</div></div>
</div>
</div>
</body></html>
