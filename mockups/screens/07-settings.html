<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Configurações</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>*{margin:0;padding:0}body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Roboto}
.phone{width:375px;height:812px;background:#000;border-radius:40px;overflow:hidden}
.header{background:#000;padding:16px;border-bottom:1px solid #1E1E1E;color:#FFD700;font-size:20px;font-weight:600}
.content{height:calc(812px - 56px);overflow-y:auto;background:#000}
.item{padding:16px;border-bottom:1px solid #1E1E1E;display:flex;align-items:center;gap:16px;cursor:pointer}.item:hover{background:#0a0a0a}
.icon{color:#FFD700}.label{flex:1;color:#FFF;font-size:14px}.arrow{color:#757575}
</style></head><body>
<div class="phone">
<div class="header">Configurações</div>
<div class="content">
<div class="item"><span class="material-icons icon">lock</span><span class="label">Controle Parental</span><span class="material-icons arrow">chevron_right</span></div>
<div class="item"><span class="material-icons icon">info</span><span class="label">Sobre</span><span class="material-icons arrow">chevron_right</span></div>
<div class="item"><span class="material-icons icon">update</span><span class="label">Atualizar Playlist</span><span class="material-icons arrow">chevron_right</span></div>
<div class="item"><span class="material-icons icon">exit_to_app</span><span class="label">Sair</span><span class="material-icons arrow">chevron_right</span></div>
</div>
</div>
</body></html>
