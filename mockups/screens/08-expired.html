<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Licença Expirada</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght:700&family=Roboto&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>*{margin:0;padding:0}body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Roboto}
.phone{width:375px;height:812px;background:#000;border-radius:40px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:32px}
.content{text-align:center}.icon{color:#F44336;font-size:80px;margin-bottom:24px}
.title{font-family:Poppins;font-size:24px;color:#FFF;margin-bottom:12px}.message{color:#CCC;font-size:14px;line-height:1.6;margin-bottom:32px}
.btn{background:linear-gradient(90deg,#FFD700,#FFC107);color:#000;border:none;padding:16px 32px;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:16px;width:100%}
.link{color:#FFD700;font-size:14px;text-decoration:none}</style>
</head><body>
<div class="phone">
<div class="content">
<div class="icon"><span class="material-icons" style="font-size:inherit">error_outline</span></div>
<div class="title">Licença Expirada</div>
<p class="message">Sua licença anual expirou. Entre em contato com seu provedor para renovar e continuar aproveitando o OPTIMUS PLAYER.</p>
<button class="btn">Renovar Agora</button>
<a href="#" class="link">Contatar Provedor</a>
</div>
</div>
</body></html>
