<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle (opcional) -->
  <circle cx="100" cy="100" r="95" fill="#000000" stroke="#FFD700" stroke-width="2"/>

  <!-- Lightning Bolt (Raio) - Amarelo -->
  <path d="M 110 30 L 75 95 L 95 95 L 85 140 L 125 75 L 105 75 L 110 30 Z"
        fill="#FFD700"
        stroke="#FFC107"
        stroke-width="1"
        stroke-linejoin="round"/>

  <!-- Play Triangle (Integrado ao raio) - Amarelo mais claro -->
  <path d="M 85 140 L 85 155 L 105 147.5 Z"
        fill="#FFC107"
        opacity="0.9"/>

  <!-- Glow Effect (Brilho) -->
  <circle cx="100" cy="85" r="40" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.3"/>
  <circle cx="100" cy="85" r="50" fill="none" stroke="#FFD700" stroke-width="0.3" opacity="0.2"/>

  <!-- Text: OPTIMUS (opcional, pode ser removido para logo icon-only) -->
  <text x="100" y="175"
        font-family="Poppins, Arial, sans-serif"
        font-size="16"
        font-weight="700"
        fill="#FFD700"
        text-anchor="middle"
        letter-spacing="2">OPTIMUS</text>
</svg>
